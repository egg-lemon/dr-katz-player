<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dr katz random episode</title>

  <!-- iOS / iPhone Home Screen Icon & App Settings -->
  <link rel="apple-touch-icon" sizes="180x180" href="icon.jpg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dr. Katz">

  <!-- Android / Browser Icon -->
  <link rel="icon" type="image/jpeg" sizes="180x180" href="icon.jpg">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                    system-ui, sans-serif;
      background: #111;
      color: white;
    }

    main {
      text-align: center;
      padding: 30px;
    }

    h1 {
      font-size: 42px;
      margin: 0 0 35px;
      letter-spacing: -1px;
    }

    button {
      border: 0;
      border-radius: 18px;
      padding: 20px 32px;
      font-size: 20px;
      font-weight: 600;
      background: white;
      color: #111;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(0.96);
    }

    #episode {
      margin-top: 25px;
      opacity: 0.65;
      font-size: 15px;
      min-height: 20px;
    }
  </style>
</head>

<body>

<main>
  <h1>dr katz</h1>

  <button onclick="randomEpisode()">
    play random episode
  </button>

  <div id="episode"></div>
</main>

<script src="episodes.js"></script>

<script>
  function randomEpisode() {
    if (!episodes || episodes.length === 0) {
      document.getElementById("episode").textContent =
        "No episodes loaded.";
      return;
    }

    let last = localStorage.getItem("lastEpisode");

    let available = episodes.filter(
      episode => episode.id !== last
    );

    if (available.length === 0) {
      available = episodes;
    }

    const episode =
      available[Math.floor(Math.random() * available.length)];

    localStorage.setItem("lastEpisode", episode.id);

    document.getElementById("episode").textContent =
      episode.title;

    window.location.href =
      "https://www.youtube.com/watch?v=" + episode.id;
  }
</script>

</body>
</html>
