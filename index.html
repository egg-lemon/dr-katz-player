<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dr katz random episode</title>

  <link rel="stylesheet" href="https://unpkg.com/xp.css">

  <link rel="apple-touch-icon" sizes="180x180" href="icon.jpg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dr. Katz">

  <link rel="icon" type="image/jpeg" sizes="180x180" href="icon.jpg">

  <style>
    * {
      box-sizing: border-box;
    }

    /* Dr. Katz Yellow Background */
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Tahoma", "Segoe UI", Geneva, Verdana, sans-serif;
      background: #d6af27;
      color: #000;
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: subpixel-antialiased;
    }

    /* CRT Scanline overlay (fixed edge-to-edge for full mobile viewports) */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.12) 50%
      );
      background-size: 100% 4px;
      z-index: 0;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      padding: 10px;
    }

    /* Standard XP Dialog Window Proportions */
    .window {
      width: 320px;
      margin: 0 auto;
    }

    .window-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      text-align: center;
    }

    /* Authentic XP Button sizing */
    button {
      min-width: 150px;
      padding: 4px 12px;
    }

    #episode {
      margin-top: 14px;
      font-size: 11px;
      color: #222;
      min-height: 16px;
      word-break: break-word;
    }
  </style>
</head>

<body>

<main>
  <div class="window">
    <div class="title-bar">
      <div class="title-bar-text">dr katz</div>
      <div class="title-bar-controls">
        <button aria-label="Minimize"></button>
        <button aria-label="Maximize"></button>
        <button aria-label="Close"></button>
      </div>
    </div>
    <div class="window-body">
      <button onclick="randomEpisode()">
        play random episode
      </button>

      <div id="episode"></div>
    </div>
  </div>
</main>

<script src="episodes.js"></script>

<script>
  function randomEpisode() {
    if (!episodes || episodes.length === 0) {
      document.getElementById("episode").textContent =
        "No episodes loaded.";
      return;
    }

    let last = localStorage.getItem("lastEpisode");

    let available = episodes.filter(
      episode => episode.id !== last
    );

    if (available.length === 0) {
      available = episodes;
    }

    const episode =
      available[Math.floor(Math.random() * available.length)];

    localStorage.setItem("lastEpisode", episode.id);

    document.getElementById("episode").textContent =
      episode.title;

    window.location.href =
      "https://www.youtube.com/watch?v=" + episode.id;
  }
</script>

</body>
</html>
